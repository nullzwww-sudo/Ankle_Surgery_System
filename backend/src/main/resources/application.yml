server:
  port: 8080 # 后端服务运行的端口

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 这里的 url 对应您的数据库 ankle_surgery_db
    url: jdbc:mysql://localhost:3306/ankle_surgery_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root # 您的数据库用户名
    password: 123456 # 您的数据库密码

  servlet:
    multipart:
      max-file-size: 50MB    # 允许单个文件最大 50MB
      max-request-size: 100MB # 允许一次请求总共最大 100MB

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 在控制台打印 SQL 语句，方便小白排错
    map-underscore-to-camel-case: true # 开启驼峰命名转换（例如 user_id 自动转为 userId）